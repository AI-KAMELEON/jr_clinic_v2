[functions.send-admin-sms]
# Funkcja wywoływana ręcznie z panelu admina (przypomnienia, odwołania, własne wiadomości)
verify_jwt = true

[functions.daily-reminder]
# Funkcja uruchamiana CRON-em codziennie, wywołuje send-admin-sms z typem PRZYPOMNIENIE
verify_jwt = false

  [[functions.daily-reminder.cron]]
  # CRON = codziennie o 17:00 czasu PL → w UTC = 15:00
  schedule = "*/2 * * * *"

[functions.agent-config]
# Funkcja do zarządzania konfiguracją agenta głosowego (GET/POST)
verify_jwt = true

[functions.elevenlabs-webhook]
# Webhook handler dla eventów z ElevenLabs (conversation_started, function_call, conversation_ended)
verify_jwt = false

[functions.elevenlabs-personalization]
# Personalizacja promptu dla każdego połączenia z ElevenLabs
verify_jwt = false

[functions.manage-appointments]
# Rezerwacje i dostępność slotów dla panelu admina
verify_jwt = false
