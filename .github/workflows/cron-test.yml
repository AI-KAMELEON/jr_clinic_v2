name: CRON sending

on:
  schedule:
    - cron: "0 15 * * *"   # wysyłka o 17:00 czasu polskiego
  workflow_dispatch:        # umożliwia ręczne wywołanie z GitHuba

jobs:
  call-function:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Supabase daily-reminder function
        run: |
          curl -X POST "https://wxzhzanagvxsiazrekia.supabase.co/functions/v1/daily-reminder" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json"
